name: PaperPath
options:
  bundleIdPrefix: com.monoware
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.1.0

targets:
  PaperPath:
    type: application
    platform: iOS
    sources:
      - path: PaperPath
        excludes:
          - Info.plist
          - PaperPath.entitlements
          - Resources/PaperPath.storekit
    dependencies:
      - target: PaperPathShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monoware.paperpath
        PRODUCT_NAME: PaperPath
        INFOPLIST_KEY_CFBundleDisplayName: PaperPath PDF
        DEVELOPMENT_TEAM: BDVY6CSEUU
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PaperPath/Info.plist
        CODE_SIGN_ENTITLEMENTS: PaperPath/PaperPath.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - PaperPathTests
        - PaperPathUITests
      storeKitConfiguration: PaperPath/Resources/PaperPath.storekit

  PaperPathShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PaperPathShareExtension
        excludes:
          - Info.plist
          - PaperPathShareExtension.entitlements
      - path: PaperPath/Services/ExternalPDFInbox.swift
      - path: PaperPath/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monoware.paperpath.share
        PRODUCT_NAME: PaperPathShareExtension
        INFOPLIST_KEY_CFBundleDisplayName: PaperPath PDF
        DEVELOPMENT_TEAM: BDVY6CSEUU
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PaperPathShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PaperPathShareExtension/PaperPathShareExtension.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  PaperPathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PaperPathTests
        excludes:
          - Fixtures/OfficeInteropCorpus
      - path: PaperPathTests/Fixtures/OfficeInteropCorpus
        type: folder
        buildPhase: resources
    dependencies:
      - target: PaperPath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monoware.paperpath.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PaperPath.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PaperPath"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PaperPathUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PaperPathUITests
    dependencies:
      - target: PaperPath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monoware.paperpath.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PaperPath
